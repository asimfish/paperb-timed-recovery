   <g id="text_1">
    <text style="fill: #172638; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="16.8144" y="21.062024" transform="rotate(-0, 16.8144, 21.062024)">Native timing interface on the preserved A-r7 laboratory</text>
   </g>
   <g id="text_2">
    <text style="fill: #24374d; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="25.78784" y="74.471881" transform="rotate(-0, 25.78784, 74.471881)">Public time contract</text>
   </g>
   <g id="text_3">
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(25.78784 92.738949)">Cue + 5 s, tolerance 50 ms</text>
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(25.78784 105.542425)">Original event reference retained</text>
   </g>
   <g id="text_4">
    <text style="fill: #24374d; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="240.50944" y="74.471881" transform="rotate(-0, 240.50944, 74.471881)">Prospective scheduling</text>
   </g>
   <g id="text_5">
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(240.50944 92.738949)">Original / dispatch / anticipation</text>
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(240.50944 105.542425)">No current-trial success labels</text>
   </g>
   <g id="text_6">
    <text style="fill: #24374d; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="464.84544" y="74.471881" transform="rotate(-0, 464.84544, 74.471881)">Native drive and physics</text>
   </g>
   <g id="text_7">
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(464.84544 92.738949)">FR3 drives + gravity correction</text>
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(464.84544 105.542425)">240 Hz; no task state writes</text>
   </g>
   <g id="text_8">
    <text style="fill: #24374d; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="25.78784" y="186.754272" transform="rotate(-0, 25.78784, 186.754272)">Prior contact measurement</text>
   </g>
   <g id="text_9">
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(25.78784 205.021339)">V79 delay upper bound</text>
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(25.78784 217.824816)">Known calibration; no learning</text>
   </g>
   <g id="text_10">
    <text style="fill: #24374d; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="240.50944" y="186.754272" transform="rotate(-0, 240.50944, 186.754272)">Raw evidence</text>
   </g>
   <g id="text_11">
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(240.50944 205.021339)">Contiguous states and contacts</text>
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(240.50944 217.824816)">Native RGB; explicit clock epoch</text>
   </g>
   <g id="text_12">
    <text style="fill: #24374d; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="464.84544" y="186.754272" transform="rotate(-0, 464.84544, 186.754272)">Independent event scoring</text>
   </g>
   <g id="text_13">
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(464.84544 205.021339)">Conservative occurrence interval</text>
    <text style="fill: #43576c; font: 9.5px 'DejaVu Sans'" transform="translate(464.84544 217.824816)">Onset / confirmation kept distinct</text>
   </g>
   <g id="text_14">
    <text style="fill: #607184; font: 10px 'DejaVu Sans'; text-anchor: start" x="16.8144" y="275.430155" transform="rotate(-0, 16.8144, 275.430155)">Implemented: one contract, three fresh trials. Chemical calibration, M1 evaluation and shared-policy learning remain open.</text>
   </g>

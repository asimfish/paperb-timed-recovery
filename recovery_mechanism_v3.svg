   <g id="text_15">
    <text style="fill: #607187; font: 11px 'DejaVu Sans'; text-anchor: start" x="428.4504" y="363.352112" transform="rotate(-0, 428.4504, 363.352112)">Forecasts guide action; execution needs evidence</text>
   </g>
   <g id="text_16">
    <text style="fill: #72609a; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="788.4144" y="218.0053" transform="rotate(-0, 788.4144, 218.0053)">3   One history-conditioned policy</text>
   </g>
   <g id="text_17">
    <text style="fill: #233348; font: 14px 'DejaVu Sans'" transform="translate(788.4144 245.89482)">Execute   /   Observe   /   Recover</text>
    <text style="fill: #233348; font: 14px 'DejaVu Sans'" transform="translate(788.4144 263.16743)">or safely terminate the attempt</text>
   </g>
   <g id="text_18">
    <text style="fill: #233348; font: 14px 'DejaVu Sans'" transform="translate(788.4144 294.78282)">Shared option decisions</text>
    <text style="fill: #233348; font: 14px 'DejaVu Sans'" transform="translate(788.4144 312.05543)">+ short robot action chunks</text>
   </g>
   <g id="text_19">
    <text style="fill: #607187; font: 12px 'DejaVu Sans'; text-anchor: start" x="788.4144" y="353.85045" transform="rotate(-0, 788.4144, 353.85045)">No online expert in retained-learning tests</text>
   </g>
   <g id="text_20">
    <text style="fill: #233348; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="788.4144" y="449.330038" transform="rotate(-0, 788.4144, 449.330038)">Physical execution + fixed adjudication</text>
   </g>
   <g id="text_21">
    <text style="fill: #233348; font: 12px 'DejaVu Sans'" transform="translate(788.4144 472.858303)">Outcome AND event timing</text>
    <text style="fill: #233348; font: 12px 'DejaVu Sans'" transform="translate(788.4144 487.663397)">TRUE / FALSE / UNKNOWN · all attempts</text>
   </g>
   <g id="text_22">
    <text style="fill: #607187; font: 11px 'DejaVu Sans'; text-anchor: start" x="952.3584" y="403.859313" transform="rotate(-0, 952.3584, 403.859313)">real process time</text>
   </g>
   <g id="text_23">
    <text style="fill: #2e8170; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="428.4504" y="449.602069" transform="rotate(-0, 428.4504, 449.602069)">Trajectory ledger  D</text>
   </g>
   <g id="text_24">
    <text style="fill: #233348; font: 12px 'DejaVu Sans'" transform="translate(428.4504 472.858303)">Student states · valid recovery · failures</text>
    <text style="fill: #233348; font: 12px 'DejaVu Sans'" transform="translate(428.4504 487.663397)">Consumer-specific labels and admission</text>
   </g>
   <g id="text_25">
    <text style="fill: #36769b; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="68.4864" y="449.602069" transform="rotate(-0, 68.4864, 449.602069)">Engineering artifact ledger  K</text>
   </g>
   <g id="text_26">
    <text style="fill: #233348; font: 12px 'DejaVu Sans'" transform="translate(68.4864 472.858303)">Validated interfaces, perception, twin, skills</text>
    <text style="fill: #233348; font: 12px 'DejaVu Sans'" transform="translate(68.4864 487.663397)">Applicability and versioned test evidence</text>
   </g>
   <g id="text_27">
    <text style="fill: #72609a; font: 13px 'DejaVu Sans'; text-anchor: middle" x="846.864" y="539.900787" transform="rotate(-0, 846.864, 539.900787)">student-state labels → policy update</text>
   </g>
   <g id="text_28">
    <text style="fill: #233348; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="52.092" y="595.350325" transform="rotate(-0, 52.092, 595.350325)">Attribute gains separately: engineering reuse  K   ·   context adaptation  M   ·   actor absorption  θ</text>
   </g>
   <g id="text_29">
    <text style="fill: #607187; font: 12px 'DejaVu Sans'; text-anchor: start" x="52.092" y="624.13125" transform="rotate(-0, 52.092, 624.13125)">Concept only. Interval bars are schematic. No new training, chemical rollout or physical result.</text>
   </g>

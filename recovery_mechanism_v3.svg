   <g id="text_1">
    <text style="fill: #233348; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="52.092" y="45.309519" transform="rotate(-0, 52.092, 45.309519)">Learn recovery that still satisfies the chemical task</text>
   </g>
   <g id="text_2">
    <text style="fill: #607187; font: 14px 'DejaVu Sans'; text-anchor: start" x="52.092" y="72.248725" transform="rotate(-0, 52.092, 72.248725)">A proposed mechanism within an agentic Real–Sim–Real engineering system</text>
   </g>
   <g id="text_3">
    <text style="fill: #607187; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="68.4864" y="120.032975" transform="rotate(-0, 68.4864, 120.032975)">ENGINEERING CONTEXT</text>
   </g>
   <g id="text_4">
    <text style="fill: #233348; font: 15px 'DejaVu Sans'; text-anchor: start" x="68.4864" y="142.364663" transform="rotate(-0, 68.4864, 142.364663)">Ingest &amp; preflight   →   Build / calibrate twin   →   Compose or train   →   Deploy &amp; diagnose</text>
   </g>
   <g id="text_5">
    <text style="fill: #36769b; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="68.4864" y="218.277331" transform="rotate(-0, 68.4864, 218.277331)">1   Event history &amp; contract</text>
   </g>
   <g id="text_6">
    <text style="fill: #233348; font: 14px 'DejaVu Sans'" transform="translate(68.4864 243.79962)">Delivered images + action feedback</text>
    <text style="fill: #233348; font: 14px 'DejaVu Sans'" transform="translate(68.4864 261.07223)">Reference event + allowed window</text>
   </g>
   <g id="text_7">
    <text style="fill: #233348; font: 14px 'DejaVu Sans'" transform="translate(68.4864 290.59242)">Public estimate: phase, delay,</text>
    <text style="fill: #233348; font: 14px 'DejaVu Sans'" transform="translate(68.4864 307.86503)">remaining time and uncertainty</text>
   </g>
   <g id="text_8">
    <text style="fill: #607187; font: 12px 'DejaVu Sans'; text-anchor: start" x="68.4864" y="353.85045" transform="rotate(-0, 68.4864, 353.85045)">Past violations stay in the attempt record</text>
   </g>
   <g id="text_9">
    <text style="fill: #2e8170; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="428.4504" y="218.0053" transform="rotate(-0, 428.4504, 218.0053)">2   Which recovery can still work?</text>
   </g>
   <g id="text_10">
    <text style="fill: #233348; font: 13px 'DejaVu Sans'; text-anchor: start" x="428.4504" y="249.366388" transform="rotate(-0, 428.4504, 249.366388)">Check duration, dependencies and support</text>
   </g>
   <g id="text_11">
    <text style="fill: #607187; font: 10px 'DejaVu Sans'; text-anchor: middle" x="666.5256" y="266.696975" transform="rotate(-0, 666.5256, 266.696975)">deadline</text>
   </g>
   <g id="text_12">
    <text style="fill: #2e8170; font: 13px 'DejaVu Sans'; text-anchor: start" x="428.4504" y="285.683188" transform="rotate(-0, 428.4504, 285.683188)">supported</text>
   </g>
